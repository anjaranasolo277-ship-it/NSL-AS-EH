<!doctype html><html lang="mg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NSL-AS/EH — Simulation</title><style>body{margin:0;background:#101827;color:#f0f5ff;font:16px system-ui}main{max-width:680px;margin:auto;padding:24px}h1{margin-bottom:4px}.muted{color:#9baac4}.panel{background:#1b2940;border:1px solid #344560;border-radius:16px;padding:20px;margin:20px 0}.floor{font-size:76px;font-weight:800;text-align:center;color:#70d9bb}.status{text-align:center;font-size:20px}.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}button{border:0;border-radius:10px;padding:17px 6px;background:#3166c7;color:white;font-size:22px;cursor:pointer}button:disabled{opacity:.35;cursor:not-allowed}.stop{background:#b53f4d;width:100%;font-size:17px;margin-top:12px}.reset{background:#47617f;width:100%;font-size:16px;margin-top:10px}li{margin:8px 0}small{color:#9baac4}</style></head><body><main><h1>NSL-AS/EH</h1><div class="muted">Ascenseur 4 étages · Simulation uniquement</div><section class="panel"><div class="muted">Étage actuel</div><div class="floor" id="floor">0</div><div class="status" id="status" aria-live="polite">À l'arrêt</div></section><section class="panel"><h2>Commande étage</h2><div class="buttons" id="buttons"></div><button class="stop" id="stop">⛔ Arrêt d'urgence (simulation)</button><button class="reset" id="reset">Réarmer la simulation</button></section><section class="panel"><h2>Historique</h2><ul id="history"></ul></section><small>Prototype logiciel indépendant. Ne pas connecter à un moteur, VFD, automate ou ascenseur réel. Aucun dispositif de sécurité physique n'est implémenté.</small></main><script>const floorEl=document.querySelector('#floor'),statusEl=document.querySelector('#status'),buttons=document.querySelector('#buttons'),history=document.querySelector('#history');let floor=0,target=null,emergency=false,timer=null;function log(message){const li=document.createElement('li');li.textContent=new Date().toLocaleTimeString()+' — '+message;history.prepend(li)}function render(){floorEl.textContent=floor;statusEl.textContent=emergency?'ARRÊT D’URGENCE':target===null?'À l’arrêt':target>floor?'Montée simulée':'Descente simulée';[...buttons.children].forEach(b=>b.disabled=emergency||target!==null||Number(b.dataset.floor)===floor)}function finish(){clearInterval(timer);timer=null;target=null;log('Arrivée à l’étage '+floor);render()}function go(n){if(emergency||target!==null||n===floor)return;target=n;log('Demande étage '+n);render();timer=setInterval(()=>{if(emergency){clearInterval(timer);timer=null;return}floor+=Math.sign(target-floor);if(floor===target)finish();else render()},1200)}for(let n=0;n<4;n++){const b=document.createElement('button');b.textContent=n;b.dataset.floor=n;b.addEventListener('click',()=>go(n));buttons.append(b)}document.querySelector('#stop').addEventListener('click',()=>{emergency=true;target=null;clearInterval(timer);timer=null;log('Arrêt d’urgence simulé');render()});document.querySelector('#reset').addEventListener('click',()=>{if(!emergency)return;emergency=false;log('Simulation réarmée');render()});log('Simulation initialisée');render();</script></body></html>
